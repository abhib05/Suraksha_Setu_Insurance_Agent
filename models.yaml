# Model registry. Policy (SRS 2.7): Meta Model API first; a non-Meta model only fills a
# documented gap and must carry a `reason`. scripts/check_models.py enforces this in CI.
policy: meta-first

models:
  muse-spark-1.3:
    provider: meta
    approved: true
    modalities: [text, image, pdf]
    price_usd_per_1m: { input: 1.25, cached_input: 0.15, output: 4.25 }
  muse-wonder-1.0:
    provider: meta
    approved: true
    preview: true
    modalities: [text, image, pdf]
    price_usd_per_1m: { input: 4.00, output: 20.00 }
  muse-spark-1.2:
    provider: meta
    approved: true
    modalities: [text, image, pdf]
    # Price not checked yet; cost logging records tokens and flags the cost as unknown.
    price_usd_per_1m: null
  muse-voice-transcribe-1.0:
    provider: meta
    approved: true
    modalities: [audio]
    price_usd_per_audio_hour: 0.18

# Which model each agent uses. Only the verifier runs on Muse Wonder (MOD-08: spend).
agents:
  coordinator:  { model: muse-spark-1.3, reasoning_effort: high }
  conversation: { model: muse-spark-1.3, reasoning_effort: low }
  document:     { model: muse-spark-1.3, reasoning_effort: medium }
  discovery:    { model: muse-spark-1.3, reasoning_effort: high }
  filing:       { model: muse-spark-1.3, reasoning_effort: high }
  verifier:     { model: muse-wonder-1.0, reasoning_effort: high, fallback: muse-spark-1.2 }
  screening:    { model: muse-spark-1.3, reasoning_effort: low }
  transcribe:   { model: muse-voice-transcribe-1.0 }
